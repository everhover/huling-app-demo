<!DOCTYPE html><html lang="zh-CN"><head><script src="./version-routing.js?v=2"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>固件升级 · 乎零</title><script src="./demo-seed.js?v=20260926-failure-1"></script><script src="./demo.js?v=20260929-version-24"></script><style>
*{box-sizing:border-box}body{margin:0;background:#F2F0ED;font-family:'PingFang SC',sans-serif;color:#1D1C1A;display:flex;justify-content:center;padding:24px}.phone{width:390px;height:844px;background:white;border-radius:46px;box-shadow:0 0 0 1px #ddd;position:relative;overflow:hidden;display:flex;flex-direction:column}.top{padding:16px 28px;font-weight:600}.back{margin:8px 20px 0;align-self:flex-start;color:#5E5A54;background:none;border:0;font:inherit;cursor:pointer}.body{padding:18px 24px 32px;overflow:auto;flex:1}h1{font-size:26px;margin:0 0 8px;font-weight:600}.muted{font-size:13px;color:#8C877F;line-height:1.7}.hero{height:250px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse,#F0F3EF,transparent 65%);margin:8px 0}.hero img{width:240px;height:240px;object-fit:contain}.notice{border-radius:12px;padding:13px 14px;background:#F5F4F0;font-size:13px;line-height:1.7}.notice.error{background:#FBF0EA;color:#A5633A}.label{display:flex;justify-content:space-between;font-size:14px;margin:20px 0 9px}.track{height:6px;border-radius:8px;background:#ECEEEA;overflow:hidden}.fill{height:100%;background:#326566;transition:width .4s;width:0}.primary{margin-top:24px;width:100%;padding:14px;border:0;border-radius:14px;background:#326566;color:white;font:inherit;font-weight:500;cursor:pointer}.primary:disabled{opacity:.5;cursor:default}.demo{border-top:1px solid #EEE;margin-top:24px;padding-top:12px}.demo button{border:0;border-radius:6px;background:#F2F0EC;color:#777;padding:7px 10px;margin:4px 3px 0 0;cursor:pointer}.demo button[aria-pressed=true]{color:#326566;background:#E7EEEA}.home{height:20px;flex:none}.home:after{content:'';display:block;width:134px;height:5px;border-radius:8px;background:#1D1C1A;margin:auto}#state{margin-top:14px;font-size:14px;color:#326566}dialog{border:0;border-radius:18px;max-width:330px;padding:24px}dialog::backdrop{background:#0005}dialog button{padding:10px;border:0;border-radius:8px;margin:8px 5px 0 0;font:inherit;cursor:pointer}
</style><link rel="stylesheet" href="./scrollbars.css?v=1"><script src="./scrollbars.js?v=1" defer></script><script src="./home-test-nav.js?v=9" defer></script></head><body><main class="phone"><div class="top">9:41</div><button class="back" id="back">‹ 设备管理</button><div class="body"><h1>固件升级</h1><div class="muted" id="version"></div><div class="hero"><img src="./assets/ring-firmware.png" alt="钛银色乎零智能戒指"></div><div class="notice" id="notice" role="status"></div><div id="state" aria-live="polite"></div><div class="label"><span>固件更新 · 传输</span><span id="transferText">0%</span></div><div class="track" role="progressbar" aria-label="固件更新进度" aria-valuemin="0" aria-valuemax="100" id="transferBar"><div class="fill" id="transfer"></div></div><div class="label"><span>安装固件</span><span id="installText">0%</span></div><div class="track" role="progressbar" aria-label="固件安装进度" aria-valuemin="0" aria-valuemax="100" id="installBar"><div class="fill" id="install"></div></div><button class="primary" id="action">开始更新</button><div class="demo"><div class="muted">演示状态 · 不会更新真实设备</div><button data-mode="normal">正常</button><button data-mode="low">低电量</button><button data-mode="offline">未连接</button></div></div><div class="home"></div></main><dialog id="leave"><strong>固件正在升级</strong><p class="muted">请留在此页面直到安装完成。离开将中止本次演示升级。</p><button id="stay">继续升级</button><button id="exit">退出升级</button></dialog><script>
const H=window.Huling,$=id=>document.getElementById(id),target='1.3.0';
let mode=H.setting('connected')===false||H.setting('device-bound')===false?'offline':(H.setting('device-battery')??78)<20?'low':'normal',transfer=0,install=0,running=false,done=H.setting('firmware-version')===target;
if(done)transfer=install=100;
function render(){
 $('version').textContent=`乎零 Ring · ${H.setting('firmware-version')||'1.2.4'}${done?' · 已是最新版本':' → '+target}`;
 $('notice').className='notice'+(mode==='normal'?'':' error');
 $('notice').textContent=mode==='low'?'戒指电量过低，请放回充电盒充电，电量达到 20% 后继续升级。':mode==='offline'?'戒指未连接，请将戒指靠近手机并重新连接。连接恢复后可继续升级。':done?'固件已更新至最新版本，现在可以离开此页面。':'更新及安装期间，请不要离开此页面，保持戒指与手机连接。';
 $('state').textContent=done?'更新完成':mode!=='normal'?(transfer||install?'升级已暂停 · 进度已保留':'等待设备就绪'):running?(transfer<100?'正在传输固件…':'正在安装固件…'):transfer||install?'设备已就绪，可继续升级':'新版本已就绪';
 for(const [key,value] of [['transfer',transfer],['install',install]]){$(key).style.width=value+'%';$(key+'Text').textContent=value+'%';$(key+'Bar').setAttribute('aria-valuenow',value);}
 $('action').textContent=done?'完成':mode==='offline'?'重新连接':mode==='low'?'请先将戒指放回充电盒':running?'升级中…':transfer||install?'继续升级':'开始更新';$('action').disabled=!done&&(mode==='low'||running);
 document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));
}
$('action').onclick=()=>{if(done){window.DemoVersion.go('./DemoPage.dc.html?view=device');return;}if(mode==='offline'){mode='normal';H.setting('connected',true);H.setting('device-bound',true);}else if(mode==='normal')running=true;render();};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;if(mode!=='normal')running=false;render();});
const timer=setInterval(()=>{if(!running||mode!=='normal'||done)return;if(transfer<100)transfer=Math.min(100,transfer+5);else install=Math.min(100,install+4);if(install===100){running=false;done=true;H.setting('firmware-version',target);}render();},450);
$('back').onclick=()=>{if(!done&&(running||transfer||install))$('leave').showModal();else window.DemoVersion.go('./DemoPage.dc.html?view=device');};$('stay').onclick=()=>$('leave').close();$('exit').onclick=()=>{clearInterval(timer);window.DemoVersion.go('./DemoPage.dc.html?view=device');};window.addEventListener('beforeunload',e=>{if(running){e.preventDefault();e.returnValue='';}});render();
</script></body></html>
