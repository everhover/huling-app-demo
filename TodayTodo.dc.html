    let groups = defs.map(([k, label, range, color]) => {
      let list = todos.filter(t => gOf(t) === k && header.matches(t)).sort((a, b) => key(a) - key(b));
      if (isFocus) { const idx = list.findIndex(t => t.id === editingId); list = idx >= 0 ? list.slice(idx) : []; }
      const isDone = k === 'done';
      return {
        label, range, color, count: list.length,
        right: isDone ? `${list.length} 项 · ${showDone ? '收起' : '展开'}` : `${list.filter(t => t.status !== 'done').length} 项`,
        cursor: isDone ? 'pointer' : 'default',
        onHeader: isDone ? () => set({ showDone: !showDone }) : undefined,
        items: isDone && !header.query && !showDone && !list.some(t => t.id === editingId) ? [] : list.map(row)
      };
    }).filter(g => g.count);
    const sg = this.props.startGroup;
    if (sg && this.state.editing === undefined) { const i = defs.findIndex(d => d[0] === sg); const keep = defs.slice(i).map(d => d[1]); groups = groups.filter(g => keep.includes(g.label)); }

    const cur = todos.find(t => t.id === editingId);
    const val = k => cur && cur[k];
    const setD = (k, v) => this.setState(s => ({ editGroup: s.editGroup || (cur ? groupOf(cur) : undefined), todos: (s.todos ?? TODOS).map(t => t.id === editingId ? { ...t, [k]: v } : t) }));
    const chipStyle = on => ({ bg: on ? '#EEEBE6' : '#FFFFFF', fg: on ? '#1D1C1A' : '#5E5A54', fw: on ? 600 : 400, bd: on ? 'transparent' : 'rgba(29,28,26,0.1)' });
    let dateOpts = [], remindOpts = [], calDays = [], monthLabel = '';
    const calM = this.state.calM ?? (cur && cur.date && cur.date.m >= 8 ? cur.date.m : 8);
    if (cur) {
      const dv = val('date');
      const presets = [['今天', D(9, 25)], ['明天', D(9, 26)], ['下周一', D(9, 28)]];
      const isPreset = presets.some(p => same(p[1], dv));
      dateOpts = presets.map(([label, dt]) => ({ label, ...chipStyle(same(dt, dv)), pick: e => { stop(e); setD('date', dt); set({ calOpen: false }); } }));
      dateOpts.push({ label: '未定', ...chipStyle(!dv), pick: e => { stop(e); setD('date', null); set({ calOpen: false }); } });
      const custom = dv && !isPreset;
      dateOpts.push({ label: (custom ? `${dv.m + 1}月${dv.d}日` : '选择日期') + ' ▾', ...chipStyle(custom || calOpen), pick: e => { stop(e); set({ calOpen: !calOpen }); } });
      remindOpts = ['不提醒', '准时', '提前 30 分钟', '提前 1 天'].map(o => ({ label: o, ...chipStyle(o === val('remind')), pick: e => { stop(e); setD('remind', o); } }));
      const lead = (new Date(2026, calM, 1).getDay() + 6) % 7, nDays = new Date(2026, calM + 1, 0).getDate();
      monthLabel = `2026年${calM + 1}月`;
      for (let k = 0; k < lead; k++) calDays.push({ n: '', bg: 'transparent', fg: 'transparent', fw: 400, bd: 'none', cursor: 'default' });
      for (let d = 1; d <= nDays; d++) {
        const dt = { m: calM, d }, n = dayNum(dt), on = same(dt, dv), today = n === 0;
        calDays.push({ n: d, cursor: n < 0 ? 'default' : 'pointer', bg: on ? '#EEEBE6' : 'transparent', fg: n < 0 ? '#D3CFC8' : '#1D1C1A', fw: on || today ? 600 : 400, bd: today && !on ? '1px solid #C9C4BC' : 'none', pick: e => { stop(e); if (n >= 0) setD('date', dt); } });
      }
    }
    const close = () => set({ editing: null, editGroup: undefined, calOpen: false });
    const onScroll = () => { if (Object.keys(held).length && !this._sc) { this._sc = setTimeout(() => { this._sc = null; this.setState({ held: {} }); }, 1200); } };
    const noteId = this.state.note || null;
    const noteT = todos.find(t => t.id === noteId);
    return {
      ...header, noSearchResults:!!header.query.trim() && !groups.some(g=>g.items.length),
      ringStatus: window.Huling.setting("connected") === false ? "戒指未连接" : "戒指 78%",
      noteOpen: !!noteT, noteTitle: noteT ? noteT.source : '', noteHighlight: noteT ? noteT.title : '',
      noteVariant: noteT && noteT.source === '和供应商讨论 PCB' ? 'confirm' : 'normal',
      closeNote: () => this.setState({ note: null }),
      pendingCount: window.Huling.pending().length,
      openCount: todos.filter(t => t.status !== 'done').length,
      listRef: this.listRef, rootRef: this.rootRef, groups, onScroll,
      dateOpts, remindOpts, calDays, monthLabel, calOpen: !!cur && calOpen,
      prevColor: calM > 8 ? '#5E5A54' : '#D3CFC8',
      prevMonth: e => { stop(e); if (calM > 8) set({ calM: calM - 1 }); },
      nextMonth: e => { stop(e); if (calM < 11) set({ calM: calM + 1 }); },
      stopClick: stop,
      onTitle: e => setD('title', e.target.value), onTime: e => setD('time', e.target.value),
      curPending: !!cur && cur.status === 'pending', confirmText: '确认',
      cancelEdit: e => { stop(e); close(); },
      confirmEdit: e => { stop(e); const prev = todos; this.setState({ todos: todos.map(t => t.id === editingId ? { ...t, status: 'open' } : t) }); this.flash('已确认', prev); },
      del: e => { stop(e); this.stageDeletion(editingId); },
      showTabBar: !cur,
      hasToast: !!this.state.toast, toast: this.state.toast,
      undo: () => { clearTimeout(this.tt); this.setState({ todos: this.state.prev, pendingDelete:null, toast: null }); }
    };
  }
}
</script>
