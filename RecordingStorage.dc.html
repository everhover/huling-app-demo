<!DOCTYPE html><html lang="zh-CN"><head><script src="./version-routing.js?v=2"></script><title>录音存储 · 乎零</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="./demo-seed.js?v=20260926-failure-1"></script><script src="./demo.js?v=20260929-version-24"></script><script src="./support.js"></script><link rel="stylesheet" href="./scrollbars.css?v=1"><script src="./scrollbars.js?v=1" defer></script><script src="./home-test-nav.js?v=9" defer></script></head><body><x-dc><helmet><style>

<div style="padding:0 20px 14px;"><div class="demo-title">录音存储</div><div style="font-size:13px;color:#8C877F;">{{ storageText }}</div><div style="font-size:11px;color:#8C877F;line-height:1.6;margin-top:7px;">删除仅移除原始录音，转写、整理内容及待办日程均保留。</div></div>
<div style="padding:0 20px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;"><select aria-label="录音排序" value="{{ sort }}" onChange="{{ changeSort }}" style="border:0;background:#F3F2EE;padding:8px;border-radius:9px;font:inherit;font-size:12px;color:#5E5A54;"><option value="newest">按创建日期</option><option value="largest">容量从大到小</option><option value="smallest">容量从小到大</option></select><button class="demo-button" onClick="{{ toggleBatch }}">{{ batchLabel }}</button></div>

<div style="padding:0 20px 20px;flex:1;min-height:0;overflow-y:auto;">

<div style="min-width:0;flex:1;"><div role="link" tabindex="0" onClick="{{ n.open }}" aria-disabled="{{ n.archived }}" style="padding:0;border:0;background:none;font:inherit;font-size:15px;font-weight:500;text-align:left;cursor:pointer;color:#1D1C1A;line-height:1.5;">{{ n.title }}</div><div style="font-size:12px;color:#8C877F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px;">{{ n.preview }}</div><div style="font-size:11px;color:#A8A39B;margin-top:8px;">{{ n.durationText }} · {{ n.createdDate }}<span style="color:#527A65;margin-left:8px;">{{ n.size }}</span></div><sc-if value="{{ n.hasStatus }}"><div style="font-size:11px;color:#8C877F;margin-top:5px;">{{ n.statusText }}</div></sc-if></div>

</div></div></sc-for></div>
<sc-if value="{{ hasMessage }}"><div role="status" style="padding:10px 20px;background:#F6F5F1;font-size:12px;">{{ message }} <button onClick="{{ undo }}" style="border:0;background:none;color:#326566;cursor:pointer;">撤销</button></div></sc-if>
<div style="height:86px;box-sizing:border-box;flex:none;border-top:1px solid #EEECE8;padding:12px 20px 28px;position:relative;"><sc-if value="{{ batch }}"><button onClick="{{ deleteSelected }}" disabled="{{ noneSelected }}" style="width:100%;padding:12px;border:0;background:#AD5C48;border-radius:12px;color:white;font:inherit;font-size:14px;opacity:{{ deleteOpacity }};cursor:pointer;">删除选中的原始录音（{{ selectedCount }}）</button></sc-if><sc-if value="{{ browsing }}"><div style="text-align:center;font-size:11px;color:#A8A39B;padding:8px;">文件大小为演示数据</div></sc-if><div style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:99px;background:#1D1C1A;"></div></div>
<sc-if value="{{ confirming }}"><div onClick="{{ cancelDelete }}" style="position:absolute;inset:0;background:#0004;z-index:20;display:flex;align-items:flex-end;"><div onClick="{{ stop }}" role="dialog" aria-label="删除原始录音" style="background:white;width:100%;padding:24px 20px 36px;box-sizing:border-box;border-radius:22px 22px 0 0;"><strong style="font-size:19px;">删除 {{ pendingCount }} 条想法的原始录音？</strong><p style="font-size:13px;color:#8C877F;line-height:1.8;">将释放 {{ pendingSize }} 空间。转写原文、整理内容、待办及日程会继续保留。</p><div style="display:flex;gap:12px;"><button class="demo-button" onClick="{{ cancelDelete }}" style="flex:1;">取消</button><button class="demo-button" onClick="{{ confirmDelete }}" style="flex:1;background:#AD5C48;color:white;">删除原始录音</button></div></div></div></sc-if>
</div></x-dc><script type="text/x-dc" data-dc-script>

 return {...H.storageQuota(),backHref:'./'+back,sort:this.state.sort,changeSort:e=>this.setState({sort:e.target.value}),batch,browsing:!batch,batchLabel:batch?'取消':'批量管理',toggleBatch:()=>this.setState({batch:!batch,selected:[]}),selectedCount:selected.length,noneSelected:!selected.length,deleteOpacity:selected.length?1:.4,selectAllLabel:selected.length===eligible.length?'取消全选':'全选',selectAll:()=>this.setState({selected:selected.length===eligible.length?[]:eligible.map(n=>n.id)}),
 rows:rows.map(n=>({...H.swipe(()=>this.setState({pending:[n.id]}),n.canDelete&&!batch,1),...n,archived:!!n.deleted,disabled:!n.canDelete,opacity:n.canDelete?1:.3,checked:selected.includes(n.id),selectLabel:'选择 '+n.title,deleteLabel:'删除 '+n.title+' 的原始录音',toggle:()=>toggle(n.id),open:()=>{if(!n.deleted)H.openNote(n.id);},remove:()=>this.setState({pending:[n.id]}),durationText:Math.floor(n.duration/60)+':'+String(n.duration%60).padStart(2,'0'),createdDate:n.createdDate||new Date(n.createdAt||Date.UTC(2026,8,25)).toISOString().slice(0,10),size:H.formatStorage(n.bytes),hasStatus:!n.canDelete||n.files.length>1,statusText:n.recordingDeleted?'原始录音已删除 · 文字内容保留':n.status==='uploading'?'正在上传，暂不可删除':n.status==='processing'?'正在整理，暂不可删除':n.files.length>1?n.files.length+' 段原始录音（已去重计量）':''})),

 }
}
}
</script></body></html>
