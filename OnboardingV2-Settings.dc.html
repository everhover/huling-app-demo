<div class="on-eyebrow">04 / 开启权限</div>
<h1 id="page-title">日历与提醒</h1>
<p class="on-copy">可选</p>
<section class="inline-permissions" aria-labelledby="page-title">

<div class="inline-permission-row"><div><label id="calendar-label" for="calendar-permission">日历权限</label><p id="calendar-purpose">用于将你确认的日程加入系统日历，<br>方便和其他安排一起查看。</p></div><button id="calendar-permission" class="inline-permission-switch" role="switch" aria-labelledby="calendar-label" aria-describedby="calendar-purpose" aria-checked="false" data-permission="calendar"><span></span></button></div>
<div class="inline-permission-row"><div><label id="notification-label" for="notification-permission">通知权限</label><p id="notification-purpose">用于在转写完成时通知你，<br>并按时提醒待办和日程。</p></div><button id="notification-permission" class="inline-permission-switch" role="switch" aria-labelledby="notification-label" aria-describedby="notification-purpose" aria-checked="false" data-permission="notification"><span></span></button></div>
<p class="permissions-footnote">可稍后在「我的」中调整</p><span class="permissions-feedback" id="permission-feedback" role="status" aria-live="polite"></span>
</section>
<div class="on-bottom"><button class="submit" id="permissions-start">开始</button><button class="on-secondary" id="permissions-later">稍后设置</button><p class="on-demo">当前为模拟权限设置</p></div>
