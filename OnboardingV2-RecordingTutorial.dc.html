<!DOCTYPE html><html lang="zh-CN"><head><script src="./version-routing.js?v=2"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>录音教学 · 乎零</title><link rel="stylesheet" href="./onboarding-auth-v2.css"><script src="./demo-seed.js?v=20260926-failure-1"></script><script src="./demo.js?v=20260929-version-24"></script><style>
.tutorial{flex:1;overflow:auto;padding:18px 24px 42px}.eyebrow{font-size:12px;color:#8C877F;letter-spacing:2px}h1{font-size:26px;margin:14px 0 10px}.intro{font-size:13px;color:#8C877F;line-height:1.8}.diagram{height:300px;position:relative;margin:20px -8px 0}.ring-button{display:block;position:absolute;left:45px;top:25px;width:244px;height:244px;padding:0;border:0;background:transparent;cursor:pointer;touch-action:manipulation}.ring-button img{width:100%;height:100%;object-fit:contain;pointer-events:none}.ring-button:disabled{cursor:default}.callout{position:absolute;font-size:12px;line-height:1.7;color:#527A65;pointer-events:none}.button-label{left:0;top:228px}.lamp-label{right:0;top:0;text-align:right}.line-button{position:absolute;left:110px;top:176px;width:8px;height:55px;border-left:1px solid #8DA397;border-bottom:1px solid #8DA397;pointer-events:none}.line-lamp{position:absolute;left:133px;top:37px;width:115px;height:91px;border-left:1px solid #8DA397;border-top:1px solid #8DA397;pointer-events:none}.led{position:absolute;left:129px;top:127px;width:8px;height:8px;border-radius:50%;background:#737975;pointer-events:none}.recording .led{background:#82DBA3;box-shadow:0 0 12px 4px #7BDC9980}.status-line{font-size:15px;color:#326566;text-align:center;min-height:25px;margin:8px 0 16px}.recording .status-line{color:#B05D50}.waves{display:flex;justify-content:center;align-items:center;gap:4px;height:38px;margin:10px 0}.waves i{width:3px;height:14px;border-radius:4px;background:#B05D50;animation:wave .65s ease-in-out infinite alternate}.waves i:nth-child(2n){animation-delay:.2s;height:26px}.waves i:nth-child(3n){animation-delay:.4s;height:20px}@keyframes wave{to{transform:scaleY(.35)}}.item{border-top:1px solid #EEEBE6;border-bottom:1px solid #EEEBE6;padding:14px 0;display:flex;flex-direction:column;gap:8px}.item-head,.item-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}.item-title{font-size:16px;font-weight:600}.time,.item-foot{font-size:12px;color:#A8A39B}.preview{font-size:14px;color:#8C877F;line-height:1.6}.tag{color:#326566;text-align:right}.track{height:4px;border-radius:9px;background:#EEEDE9;overflow:hidden}.fill{height:100%;background:#91A799;width:0;transition:width .1s}.submit{margin-top:26px}.demo-note{text-align:center;margin-top:20px}[hidden]{display:none!important}
</style><link rel="stylesheet" href="./scrollbars.css?v=1"><script src="./scrollbars.js?v=1" defer></script><script src="./home-test-nav.js?v=9" defer></script><link rel="stylesheet" href="./onboarding-v2.css?v=3"></head><body><main class="auth-phone" id="screen"><div class="status"><span>9:41</span><a class="system-icons" href="./OnboardingV2-Launch.dc.html" aria-label="重新开始 App 启动流程" title="重新开始 App 启动流程" style="color:inherit;text-decoration:none;padding:8px 0;">▂▅▇ ▰</a></div><div class="tutorial"><div class="on-step"><i class="active"></i><i class="active"></i><i class="active"></i><i></i></div><div class="eyebrow">03 / 记录第一个想法</div><h1>把第一个想法说出来</h1><div class="intro">试着说：“明天早上出门散步，<br>顺便买一杯喜欢的咖啡。”</div><div class="diagram"><button class="ring-button" id="ring" aria-label="双击开始录音"><img src="./assets/ring-firmware.png" alt="乎零戒指，外侧圆形按钮上方为指示灯"></button><div class="line-button"></div><div class="line-lamp"></div><div class="led" id="led"></div><div class="callout button-label" id="button-label">双击开始录音</div><div class="callout lamp-label">开始录音时<br>指示灯会亮起</div></div><div class="status-line" id="status" role="status" aria-live="polite">鼠标双击上方戒指，试着录下一个想法</div><div class="waves" id="waves" hidden><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="item" id="item" hidden><div class="item-head"><span class="item-title" id="title">正在上传…</span><span class="time">刚刚</span></div><div class="preview" id="preview" hidden>明天早上出门散步，顺便买一杯喜欢的咖啡。</div><div class="track" id="track" role="progressbar" aria-label="录音上传进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div><div class="item-foot"><span id="meta"></span><span class="tag" id="tag">上传中 · 0%</span></div></div><button class="submit" id="enter" hidden>继续</button><p class="demo-note">模拟录音教学 · 不会开启麦克风或操作真实戒指</p></div><div class="home"></div></main><script>
const $=id=>document.getElementById(id);let stage='idle',progress=0,uploadTimer,phaseTimer;const date=new Date();$('meta').textContent='▶ 0:04  '+date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
function start(){if(stage!=='idle')return;stage='recording';$('button-label').textContent='双击结束录音';$('ring').setAttribute('aria-label','双击结束录音');$('screen').classList.add('recording');$('status').textContent='录音中… 双击戒指结束录音';$('waves').hidden=false;}
$('ring').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(stage==='idle')start();else if(stage==='recording')upload();}};
$('ring').ondblclick=()=>{if(stage==='idle')start();else if(stage==='recording')upload();};
function upload(){if(stage!=='recording')return;stage='uploading';$('ring').disabled=true;$('button-label').textContent='录音已结束';$('ring').setAttribute('aria-label','录音已结束');$('screen').classList.remove('recording');$('waves').hidden=true;$('item').hidden=false;$('status').textContent='录音已结束，正在上传';uploadTimer=setInterval(()=>{progress=Math.min(100,progress+5);$('fill').style.width=progress+'%';$('track').setAttribute('aria-valuenow',progress);$('tag').textContent='上传中 · '+progress+'%';if(progress===100){clearInterval(uploadTimer);stage='transcribing';$('track').hidden=true;$('title').textContent='正在转写…';$('tag').textContent='正在转写';$('status').textContent='上传完成，正在把声音变成文字';phaseTimer=setTimeout(finish,1500);}},100);}
function finish(){const H=window.Huling,id='tutorial-first-thought',text='明天早上出门散步，顺便买一杯喜欢的咖啡。';if(!H.note(id))H.state.notes.push({id,title:'我的第一个想法',summary:text,preview:text,segs:[[0,text]],duration:4,status:'ready',group:0,time:date.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}),createdAt:date.getTime(),updatedAt:date.getTime(),unread:true});H.updateNote(id,{});stage='done';$('title').textContent='我的第一个想法';$('preview').hidden=false;$('tag').textContent='已整理';$('status').textContent='✓ 已保存，你的第一个想法';$('enter').hidden=false;$('item').setAttribute('role','link');$('item').setAttribute('tabindex','0');$('item').setAttribute('aria-label','继续开启权限');$('item').style.cursor='pointer';}
function enter(){if(stage==='done')window.DemoVersion.go('./OnboardingV2-Settings.dc.html');}$('enter').onclick=enter;$('item').onclick=enter;$('item').onkeydown=e=>{if(e.key==='Enter')enter();};window.addEventListener('pagehide',()=>{clearTimeout(phaseTimer);clearInterval(uploadTimer);});
</script></body></html>
